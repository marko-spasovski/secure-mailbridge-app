name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# An explicit bash shell runs with pipefail, so `npm run test:coverage | tee` fails when the tests fail.
# The implicit default (bash -e) takes the exit status of tee alone.
defaults:
  run:
    shell: bash

# Every action is pinned to a full commit SHA and every image to a digest, so a moved tag cannot change what runs here.
# Dependabot keeps the pins up to date; the comment after each SHA says which release it is.
env:
  NODE_ENV: test
  SESSION_SECRET: ci-only-random-test-secret-not-for-production
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: 5432
  POSTGRES_DB: mailbridge_test
  POSTGRES_USER: mailbridge_test
  POSTGRES_PASSWORD: ci-only-password
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
  SEMGREP_IMAGE: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  REDOCLY_IMAGE: redocly/cli:2.62.0@sha256:4497cdb4450ed434c72821419af114ffdafa7e5bd966ade394adc50176261545

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integration tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: mailbridge_test
          POSTGRES_USER: mailbridge_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mailbridge_test -d mailbridge_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Running the migrations twice proves they are safe to re-run on an up-to-date database.
      - run: npm run migration
      - run: npm run migration
      # Every migration after 008 (which replaced the old ticket schema and is deliberately one-way) must roll back
      # and apply again cleanly.
      - name: Roll back and re-apply every reversible migration
        run: |
          reversible=$(find database/migrations -name '*.sql' | awk -F/ '$NF >= "009"' | wc -l)
          npm run migration -- down "$reversible"
          npm run migration
      - name: Unit and integration tests with coverage thresholds
        run: npm run test:coverage 2>&1 | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: mailbridge_test
          POSTGRES_USER: mailbridge_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mailbridge_test -d mailbridge_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
      - run: npm run test:e2e
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          SCREENSHOT_DIR: test-results/screenshots
      - name: Keep screenshots of every screen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.browser }}
          path: test-results/screenshots
          if-no-files-found: ignore
          retention-days: 14

  mutation:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: mailbridge_test
          POSTGRES_USER: mailbridge_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mailbridge_test -d mailbridge_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every deliberate bug in tests/mutation/mutations.ts must be caught by the tests.
      - run: npm run test:mutation
      - name: The working tree is unchanged afterwards
        run: git diff --exit-code

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Review dependencies added by this pull request
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Known false positives are listed, with a reason, in .gitleaksignore.
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" detect --source . --redact --verbose

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Explicit rule packs instead of --config auto, so the rules only change when this file does.
      - run: >-
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan
          --config p/javascript --config p/typescript --config p/owasp-top-ten --config p/secrets --config p/dockerfile
          --metrics=off --error --exclude node_modules --exclude dist

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

  contract:
    name: API contract lint (Redocly)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rules are in redocly.yaml; reviewed exceptions, each with a reason, in .redocly.lint-ignore.yaml.
      - run: docker run --rm -v "$PWD:/spec" -w /spec "$REDOCLY_IMAGE" lint

  config-scan:
    name: Configuration scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" config
          --exit-code 1 --severity MEDIUM,HIGH,CRITICAL --skip-dirs node_modules .

  image:
    name: Build, scan and smoke-test the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: mailbridge_test
          POSTGRES_USER: mailbridge_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mailbridge_test -d mailbridge_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: mailbridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image is handed to Trivy as a file, so the scanner never gets the Docker socket.
      - name: Scan the image for known vulnerabilities
        run: |
          docker save mailbridge:ci -o image.tar
          docker run --rm -v "$PWD:/scan" "$TRIVY_IMAGE" image --input /scan/image.tar \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln
          rm image.tar
      - name: Start the production image against a fresh database
        run: ./deploy/smoke-test.sh mailbridge:ci

  publish:
    name: Publish image
    if: github.event_name == 'push'
    needs: [verify, integration, e2e, mutation, audit, secrets, sast, workflows, contract, config-scan, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign where the image was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
